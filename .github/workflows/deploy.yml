name: Deploy API to Render

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:   # allows manual trigger from GitHub UI

# Never let two deploys of the same branch race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Dependency caching ─────────────────────────────────────────────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Branch → environment routing ───────────────────────────────────
      # dev  -> staging, main -> production. Any other ref (e.g. a manual
      # dispatch from a feature branch) is treated as non-protected: we do not
      # have a Render environment for it, so deploy/health/smoke are skipped.
      - name: Select target environment
        id: target
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "env_name=staging" >> "$GITHUB_OUTPUT"
              echo "is_protected=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "env_name=production" >> "$GITHUB_OUTPUT"
              echo "is_protected=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "env_name=none" >> "$GITHUB_OUTPUT"
              echo "is_protected=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Target environment: $(grep env_name "$GITHUB_OUTPUT" | cut -d= -f2)"

      # ── Deterministic Render deploy ────────────────────────────────────
      # Triggers a deploy of the correct service pinned to this commit SHA and
      # blocks until Render reports that specific deploy live (or fails). No
      # fixed sleeps: the step's exit code is Render's real deploy status.
      - name: Deploy to Render and wait for it to go live
        if: steps.target.outputs.is_protected == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # Both ids are exposed; the correct one is chosen strictly by branch
          # below (avoids empty-string fallback selecting the wrong environment).
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            export RENDER_SERVICE_ID="$RENDER_PRODUCTION_SERVICE_ID"
          else
            export RENDER_SERVICE_ID="$RENDER_STAGING_SERVICE_ID"
          fi
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "ERROR: RENDER_API_KEY and the ${{ steps.target.outputs.env_name }} service id must be configured as GitHub secrets."
            exit 1
          fi
          python scripts/render_deploy.py

      # ── Health gate (against the branch-specific URL) ──────────────────
      - name: Health gate check
        if: steps.target.outputs.is_protected == 'true'
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            API_URL="$PRODUCTION_API_URL"
          else
            API_URL="$STAGING_API_URL"
          fi
          if [ -z "$API_URL" ]; then
            echo "ERROR: the ${{ steps.target.outputs.env_name }} API URL secret is not configured."
            exit 1
          fi
          MAX_RETRIES=5
          RETRY_DELAY=15
          URL="${API_URL}/health"

          echo "Pinging health gate at: $URL"
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i of $MAX_RETRIES..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30) || true

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              exit 0
            fi

            echo "Got HTTP $HTTP_STATUS — retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "ERROR: Health gate failed after $MAX_RETRIES attempts on the ${{ steps.target.outputs.env_name }} environment."
          exit 1

      # ── Smoke tests (against the same branch-specific URL) ─────────────
      - name: Run smoke tests against live deployment
        if: steps.target.outputs.is_protected == 'true'
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          RUN_REAL_SCAN: "true"
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            export API_URL="$PRODUCTION_API_URL"
          else
            export API_URL="$STAGING_API_URL"
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "ERROR: JWT_SECRET is required to run smoke tests against a protected environment."
            exit 1
          fi
          echo "Running smoke tests against: $API_URL"
          python tests/smoke_test.py

      # ── Non-protected refs ─────────────────────────────────────────────
      - name: Skip deploy for non-protected ref
        if: steps.target.outputs.is_protected != 'true'
        run: |
          echo "Ref '${{ github.ref_name }}' has no Render environment (only dev->staging and main->production deploy)."
          echo "Skipping deploy, health gate, and smoke tests."
